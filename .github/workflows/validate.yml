name: validate-v0.5

on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'scripts/**'
      - 'benchmarks/fixtures/**'
      - 'skills/**'
      - 'docs/**'
      - 'README.md'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Valid fixture must pass
        run: python scripts/validate_state.py benchmarks/fixtures/valid-standard.yaml
      - name: Broken evidence fixture must fail
        shell: bash
        run: |
          if python scripts/validate_state.py benchmarks/fixtures/invalid-broken-evidence.yaml; then
            echo 'Broken evidence fixture unexpectedly passed'
            exit 1
          fi
      - name: Generic AI voice fixture must fail Author Gate
        shell: bash
        run: |
          if python scripts/validate_state.py benchmarks/fixtures/invalid-generic-ai-voice.yaml; then
            echo 'Generic AI voice fixture unexpectedly passed'
            exit 1
          fi
